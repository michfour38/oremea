name: Admin Resonance transaction trace 2026-09-28

on:
  push:
    branches:
      - feat/admin-resonance-transaction-trace-2026-09-28

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/admin-resonance-transaction-trace-2026-09-28

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expand owner-only transaction trace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog = Path("src/lib/whop/resonance-catalog.ts")
          text = catalog.read_text()
          old = '''  const recentOrders = await prisma.resonance_visit_orders.findMany({
              orderBy: { created_at: "desc" }, take: 10,
              select: { id: true, kind: true, quantity: true, remaining_quantity: true,
                status: true, whop_payment_id: true, whop_checkout_id: true },
            });'''
          new = '''  const recentOrders = await prisma.resonance_visit_orders.findMany({
              orderBy: { created_at: "desc" }, take: 10,
              select: {
                id: true,
                kind: true,
                quantity: true,
                amount_cents: true,
                remaining_quantity: true,
                status: true,
                parent_id: true,
                affiliate_code: true,
                whop_plan_id: true,
                whop_payment_id: true,
                whop_checkout_id: true,
                paid_at: true,
                created_at: true,
                _count: { select: { redemptions: true } },
              },
            });'''
          if old not in text:
              raise SystemExit("recentOrders selection block not found")
          catalog.write_text(text.replace(old, new, 1))

          page = Path("app/admin/resonance-commerce/page.tsx")
          text = page.read_text()
          anchor = '''  const [status, creatorStarter] = await Promise.all([
              getResonanceWhopProvisioningStatus(),
              getCreatorStarterWhopProvisioningStatus(),
            ]);
          '''
          replacement = '''  const [status, creatorStarter] = await Promise.all([
              getResonanceWhopProvisioningStatus(),
              getCreatorStarterWhopProvisioningStatus(),
            ]);
            const planLabels = new Map<string, string>();
            for (const plan of status.plans) {
              if (plan.id) planLabels.set(plan.id, plan.label);
            }
            if (creatorStarter.planId) {
              planLabels.set(creatorStarter.planId, "Creator Resonance Starter");
            }
          '''
          if anchor not in text:
              raise SystemExit("admin status anchor not found")
          text = text.replace(anchor, replacement, 1)

          marker = "Latest ten orders — identifiers and settlement state only"
          marker_pos = text.find(marker)
          if marker_pos < 0:
              raise SystemExit("recent order table caption not found")
          start = text.rfind('          <div className="mt-5 overflow-x-auto">', 0, marker_pos)
          if start < 0:
              raise SystemExit("recent order table start not found")
          end = text.find("          </div>", marker_pos)
          if end < 0:
              raise SystemExit("recent order table end not found")
          end += len("          </div>")
          new_table = '''          <div className="mt-5 overflow-x-auto">
            <table className="w-full min-w-[1180px] text-left text-xs">
              <caption className="mb-2 text-left">
                Latest ten orders — owner-only lifecycle trace, without buyer email
              </caption>
              <thead>
                <tr>
                  <th>Created / paid</th>
                  <th>Order / parent</th>
                  <th>Lane / amount</th>
                  <th>Requested referral</th>
                  <th>Status</th>
                  <th>Visits</th>
                  <th>Checkout</th>
                  <th>Payment</th>
                </tr>
              </thead>
              <tbody>{status.recentOrders.map((order) => (
                <tr key={order.id} className="align-top">
                  <td className="py-2 pr-4">
                    <div>{traceTime(order.created_at)}</div>
                    <div className="mt-1 text-zinc-600">Paid {traceTime(order.paid_at)}</div>
                  </td>
                  <td className="py-2 pr-4">
                    <div>{order.id}</div>
                    <div className="mt-1 text-zinc-600">Parent {order.parent_id ?? "—"}</div>
                  </td>
                  <td className="py-2 pr-4">
                    <div>{planLabels.get(order.whop_plan_id) ?? "Unknown plan"}</div>
                    <div className="mt-1 text-zinc-500">{order.kind} · {formatOremeaPrice(order.amount_cents)}</div>
                    <div className="mt-1 text-zinc-600">{order.whop_plan_id}</div>
                  </td>
                  <td className="py-2 pr-4">{order.affiliate_code ?? "Direct / none"}</td>
                  <td className="py-2 pr-4">{order.status}</td>
                  <td className="py-2 pr-4">
                    {order.quantity} bought · {order._count.redemptions} redeemed · {order.remaining_quantity} unused
                  </td>
                  <td className="py-2 pr-4">{order.whop_checkout_id ?? "—"}</td>
                  <td className="py-2">{order.whop_payment_id ?? "—"}</td>
                </tr>
              ))}</tbody>
            </table>
            <p className="mt-3 text-xs leading-5 text-zinc-600">
              Requested referral is the code Oremea carried into checkout. Whop remains the source of truth for actual affiliate attribution and commission.
            </p>
          </div>'''
          text = text[:start] + new_table + text[end:]

          helper_anchor = '''function Status({
          '''
          helper = '''function traceTime(value: Date | null) {
            if (!value) return "—";
            return value.toISOString().replace("T", " ").replace(".000Z", "Z");
          }

          function Status({
          '''
          if helper_anchor not in text:
              raise SystemExit("Status helper anchor not found")
          page.write_text(text.replace(helper_anchor, helper, 1))

          test = Path("scripts/verify-resonance-provisioning-contract.ts")
          text = test.read_text()
          console_old = 'console.log("Provisioning reuses the company/catalog without financial endpoints; conflict, missing ID, wrong price and decline recovery guards passed (mocked provider/storage).");'
          marker_pos = text.find(console_old)
          if marker_pos < 0:
              raise SystemExit("provisioning test console marker not found")
          insert = '''const adminTrace = readFileSync("app/admin/resonance-commerce/page.tsx", "utf8");
            assert.match(adminTrace, /owner-only lifecycle trace/);
            assert.match(adminTrace, /Requested referral/);
            assert.match(adminTrace, /Whop remains the source of truth for actual affiliate attribution and commission/);
            assert.match(adminTrace, /Creator Resonance Starter/);
            assert.match(adminTrace, /order\\._count\\.redemptions/);
            assert.doesNotMatch(adminTrace, /order\\.buyer_email/);
            const catalogSource = readFileSync("src/lib/whop/resonance-catalog.ts", "utf8");
            for (const field of ["amount_cents", "parent_id", "affiliate_code", "whop_plan_id", "paid_at", "created_at"]) {
              assert.match(catalogSource, new RegExp(`${field}: true`));
            }
            assert.match(catalogSource, /_count: \\{ select: \\{ redemptions: true \\} \\}/);
            '''
          text = text[:marker_pos] + insert + text[marker_pos:]
          text = text.replace(
              console_old,
              'console.log("Provisioning reuses the company/catalog without financial endpoints; conflict, missing ID, wrong price, decline recovery, and owner-only transaction trace guards passed (mocked provider/storage).");',
              1,
          )
          test.write_text(text)
          PY

      - name: Validate Resonance trace contract
        run: npm run test:resonance-visits

      - name: Typecheck
        run: npm run typecheck

      - name: Validate complete Oremea application
        run: npm run build

      - name: Commit exact tested source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/admin-resonance-transaction-trace-2026-09-28.yml
          git add src/lib/whop/resonance-catalog.ts app/admin/resonance-commerce/page.tsx scripts/verify-resonance-provisioning-contract.ts
          git commit -m "feat: expand owner Resonance transaction trace"
          git push
