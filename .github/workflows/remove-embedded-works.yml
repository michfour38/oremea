name: Remove embedded WORKS runtime

on:
  push:
    branches:
      - work/remove-embedded-works

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove embedded WORKS application surface
        shell: bash
        run: |
          set -euo pipefail

          # WORKS now owns these application/runtime surfaces in michfour38/works.
          rm -rf app/works app/api/works components/works lib/works prisma/seeds/works
          rm -f public/works-logo.svg
          find scripts -maxdepth 1 -type f -name 'verify-works-*.ts' -delete

          python <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          scripts = package['scripts']
          scripts.pop('db:seed:works', None)
          scripts.pop('test:works-payfast', None)
          launch = scripts['test:launch']
          launch = launch.replace(' && npm run test:works-payfast', '')
          if 'works' in launch.lower():
              raise SystemExit('WORKS still appears in test:launch after cleanup')
          scripts['test:launch'] = launch
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          middleware_path = Path('middleware.ts')
          middleware = middleware_path.read_text()

          start = middleware.index('const WORKS_HOST')
          end = middleware.index('const OREMEA_PUBLIC_HOSTS', start)
          middleware = middleware[:start] + middleware[end:]

          start = middleware.index('function worksDomainResponse')
          end = middleware.index('function rewriteRecognitionPath', start)
          middleware = middleware[:start] + middleware[end:]

          public_block = '''  // WORKS begins anonymously. Public founder search, provider profiles,\n  // provider response links and onboarding surfaces must render without\n  // Clerk forcing a platform sign-in. Sensitive WORKS APIs enforce their\n  // own account/session/token authorization inside each route.\n  "/works(.*)",\n  "/api/works(.*)",\n'''
          if public_block not in middleware:
              raise SystemExit('Expected WORKS public-route block not found')
          middleware = middleware.replace(public_block, '', 1)

          response_block = '''\n  const worksResponse = worksDomainResponse(req);\n  if (worksResponse) return worksResponse;\n'''
          if response_block not in middleware:
              raise SystemExit('Expected WORKS middleware response block not found')
          middleware = middleware.replace(response_block, '', 1)
          middleware_path.write_text(middleware)

          Path('prisma/seeds/run-all.ts').write_text('''import { PrismaClient } from "@prisma/client";\n\nimport { seedAllResonance } from "./resonance-seed-lib";\nimport { verifyResonanceSeed } from "../scripts/resonance-verify-lib";\n\nconst prisma = new PrismaClient();\n\nasync function main() {\n  await seedAllResonance(prisma);\n  await verifyResonanceSeed(prisma);\n\n  console.log("Verified Resonance content seeded.");\n}\n\nmain()\n  .catch((error) => {\n    console.error(error);\n    process.exitCode = 1;\n  })\n  .finally(async () => {\n    await prisma.$disconnect();\n  });\n''')
          PY

      - name: Verify separation boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/works
          test ! -e app/api/works
          test ! -e components/works
          test ! -e lib/works
          test ! -e prisma/seeds/works
          test ! -e public/works-logo.svg
          ! find scripts -maxdepth 1 -type f -name 'verify-works-*.ts' | grep -q .
          ! grep -q 'WORKS_HOST\|worksDomainResponse\|/api/works(\.\*)\|"/works(\.\*)"' middleware.ts
          ! grep -q 'db:seed:works\|test:works-payfast' package.json
          ! grep -qi 'seedWorks\|seedAllWorks' prisma/seeds/run-all.ts

          # Shared live DB safety boundary: WORKS database definitions/history stay in Oremea.
          test -d prisma/works
          test -d prisma/migrations
          test "$(find prisma/migrations -type f -name '*.sql' | wc -l)" -gt 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Oremea
        run: npm run typecheck

      - name: Oremea production build and launch guardrails
        run: npm run build

      - name: Publish only after green
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/remove-embedded-works.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No cleanup changes to publish'; exit 1; }
          git commit -m "Remove embedded WORKS runtime from Oremea"
          git push origin HEAD:main
