name: Bearing KLT copy patch

on:
  push:
    branches:
      - copy/resonance-bearing-klt-2026-09-28

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy/resonance-bearing-klt-2026-09-28
      - name: Apply Bearing copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          entry = Path('app/(member)/entry/page.tsx')
          text = entry.read_text()
          replacement = "\n".join([
              '  4: {',
              '    label: "Alignment",',
              '    question: "Everything cannot come first.",',
              '    description:',
              '      "Several things can matter deeply and still compete for the same time, attention, energy or resources. Bearing puts stated priorities beside lived decisions so the trade-offs become easier to see: what keeps getting protected, what is repeatedly deferred, what changes under pressure, and where someone else’s input may be carrying more authority than you meant to give it. One choice is not a verdict on your character. The room is interested in the direction your choices are creating now.",',
              '    chooseWhen:',
              '      "several important things are competing, a decision keeps wobbling, or what you say matters and what your life is currently giving priority to no longer seem to point the same way. Bearing clarifies direction without deciding what should win or turning that clarity into an action plan.",',
              '    comparison: "What gets protected, delayed or traded away makes current direction visible.",',
              '  },',
              '  5: {',
          ])
          text, count = re.subn(r'  4: \{.*?\n  \},\n  5: \{', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Bearing entry copy block not found')
          entry.write_text(text)

          marketing = Path('src/lib/oremea/public-product-marketing.ts')
          text = marketing.read_text()
          replacement = "\n".join([
              '  "resonance-bearing": {',
              '    id: "resonance-bearing",',
              '    category: "Resonance room 4",',
              '    headline: "Everything cannot come first",',
              '    buyerDecision:',
              '      "When several things genuinely matter, clarity comes from seeing what your real choices are already protecting, delaying or costing.",',
              '    description:',
              '      "Bearing puts stated priorities beside lived decisions: where time, attention and resources go, what gets less, what changes under pressure, and where words and actions stop pointing in the same direction. It makes current orientation visible without declaring a single choice to be your ‘true values’ or a verdict on your character.",',
              '    chooseWhen:',
              '      "Enter Bearing when important priorities are competing, a decision keeps wobbling, or your lived choices no longer seem to match what you say matters. It helps make the trade-offs and decision ownership visible without deciding what should win or turning clarity into an execution plan.",',
              '    limits: [',
              '      "No moral ranking of values.",',
              '      "No instruction about which value should win.",',
              '      "No Compass-style plan or prescribed next action.",',
              '    ],',
              '    public: true,',
              '    weekNumber: 4,',
              '  },',
              '  "resonance-pulse": {',
          ])
          text, count = re.subn(r'  "resonance-bearing": \{.*?\n  \},\n  "resonance-pulse": \{', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Bearing public marketing block not found')
          marketing.write_text(text)

          contract = Path('scripts/verify-product-marketing-contract.ts')
          text = contract.read_text()
          old = 'assert.match(roomById["resonance-bearing"].description, /choices, allocations and trade-offs/i);'
          new = "\n".join([
              'assert.match(roomById["resonance-bearing"].headline, /everything cannot come first/i);',
              'assert.match(roomById["resonance-bearing"].description, /stated priorities beside lived decisions/i);',
              'assert.match(roomById["resonance-bearing"].chooseWhen, /decision ownership/i);',
              'assert.doesNotMatch(roomById["resonance-bearing"].description, /execution plan|moral ranking|should win/i);',
          ])
          if old not in text:
              raise SystemExit('Bearing marketing contract anchor not found')
          contract.write_text(text.replace(old, new, 1))
          PY
      - name: Verify Bearing marketing and types
        run: |
          npm ci
          npm run test:product-marketing
          npm run typecheck
      - name: Commit tested Bearing copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bearing-klt-patch.yml
          git add 'app/(member)/entry/page.tsx' src/lib/oremea/public-product-marketing.ts scripts/verify-product-marketing-contract.ts
          git commit -m "Rewrite Bearing as KLT conversion copy"
          git push origin HEAD:copy/resonance-bearing-klt-2026-09-28
