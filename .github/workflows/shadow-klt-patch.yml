name: Shadow KLT copy patch

on:
  push:
    branches:
      - copy/resonance-shadow-klt-2026-09-28

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy/resonance-shadow-klt-2026-09-28
      - name: Apply Shadow copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          entry = Path('app/(member)/entry/page.tsx')
          text = entry.read_text()
          replacement = "\n".join([
              '  6: {',
              '    label: "Protection",',
              '    question: "Sometimes reaction arrives before choice.",',
              '    description:',
              '      "Under pressure, a familiar response can move quickly enough to feel like the only response available. It may help in the moment and still leave a cost afterward. Shadow slows that sequence down without deciding where it came from. It makes room to notice what changed, what the reaction helped with, what became harder to see, what is actually true now, and where a response that once made sense may no longer need to make every decision.",',
              '    chooseWhen:',
              '      "a reaction feels stronger, faster or more familiar than you want it to be and you want to understand its usefulness, its cost, and whether another response is available now. Shadow does not assume trauma, a hidden wound, a defence mechanism or a diagnosis. The reaction can be respected without being handed the final say.",',
              '    comparison: "Notice the reaction. Keep the choice.",',
              '  },',
              '  7: {',
          ])
          text, count = re.subn(r'  6: \{.*?\n  \},\n  7: \{', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Shadow entry copy block not found')
          entry.write_text(text)

          marketing = Path('src/lib/oremea/public-product-marketing.ts')
          text = marketing.read_text()
          replacement = "\n".join([
              '  "resonance-shadow": {',
              '    id: "resonance-shadow",',
              '    category: "Resonance room 6",',
              '    headline: "When reaction arrives before choice",',
              '    buyerDecision:',
              '      "A strong reaction can make sense and still take over more of the moment than you want it to.",',
              '    description:',
              '      "Shadow slows a strong or familiar reaction down enough to see what changed, what the response helped with, what it cost, what is different now and where another choice may be available. It stays with the evidence you bring rather than explaining the reaction with a hidden wound or theory about your psyche.",',
              '    chooseWhen:',
              '      "Enter Shadow when a reaction feels stronger, faster or more familiar than you want it to be. The room helps you examine usefulness, cost and present choice without assuming trauma, defence, projection or a hidden cause.",',
              '    limits: [',
              '      "No assumed trauma, defence or hidden wound.",',
              '      "No projection theory.",',
              '      "No diagnosis of disowned parts.",',
              '    ],',
              '    public: true,',
              '    weekNumber: 6,',
              '  },',
              '  "resonance-forge": {',
          ])
          text, count = re.subn(r'  "resonance-shadow": \{.*?\n  \},\n  "resonance-forge": \{', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Shadow public marketing block not found')
          marketing.write_text(text)

          contract = Path('scripts/verify-product-marketing-contract.ts')
          text = contract.read_text()
          old = "\n".join([
              'assert.match(roomById["resonance-shadow"].description, /strong reactions and familiar moves/i);',
              'assert.doesNotMatch(roomById["resonance-shadow"].description, /projection|disowned|trauma/i);',
          ])
          new = "\n".join([
              'assert.match(roomById["resonance-shadow"].headline, /reaction arrives before choice/i);',
              'assert.match(roomById["resonance-shadow"].description, /usefulness|helped with/i);',
              'assert.match(roomById["resonance-shadow"].description, /where another choice may be available/i);',
              'assert.doesNotMatch(roomById["resonance-shadow"].description, /projection|disowned|trauma|defence mechanism/i);',
          ])
          if old not in text:
              raise SystemExit('Shadow marketing contract anchor not found')
          contract.write_text(text.replace(old, new, 1))
          PY
      - name: Verify Shadow marketing and types
        run: |
          npm ci
          npm run test:product-marketing
          npm run typecheck
      - name: Commit tested Shadow copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/shadow-klt-patch.yml
          git add 'app/(member)/entry/page.tsx' src/lib/oremea/public-product-marketing.ts scripts/verify-product-marketing-contract.ts
          git commit -m "Rewrite Shadow as KLT conversion copy"
          git push origin HEAD:copy/resonance-shadow-klt-2026-09-28
