name: One-time WORKS live source probe

on:
  pull_request:
    branches:
      - works-production
    paths:
      - .github/workflows/works-live-source-probe-2026-08-23.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live WORKS base canvas deployment
        run: |
          set -euo pipefail
          url="https://works.oremea.com/providers/nexus-fulfilment"
          for attempt in $(seq 1 30); do
            curl -fsS "${url}?contrastProof=recheck-${attempt}-$(date +%s)" -o /tmp/provider.html
            if grep -Fq 'min-h-screen bg-[#fbfaf7] text-[#1f1c17]' /tmp/provider.html; then
              echo "LIVE_WORKS_BASE_CANVAS=PASS attempt=${attempt}"
              exit 0
            fi
            echo "Waiting for Railway contrast deployment: attempt ${attempt}"
            sleep 6
          done
          echo "Live public provider profile never exposed the new WORKS base canvas."
          exit 1
