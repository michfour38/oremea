name: Verify live WORKS security deployment

on:
  push:
    branches:
      - ops/works-live-security-verify-2026-08-24
    paths:
      - .github/workflows/works-live-security-verify-2026-08-24.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for Railway and fingerprint served security bundle
        shell: bash
        run: |
          set -euo pipefail
          base="https://works.oremea.com"
          mkdir -p /tmp/works-live
          pass=0
          marker=""
          for attempt in $(seq 1 30); do
            rm -f /tmp/works-live/*.html /tmp/works-live/*.js /tmp/works-live/scripts.txt
            home_code=$(curl -L -sS -o /tmp/works-live/home.html -w '%{http_code}' "$base/") || home_code=000
            provider_code=$(curl -L -sS -o /tmp/works-live/provider.html -w '%{http_code}' "$base/provider") || provider_code=000
            api_code=$(curl -sS -o /tmp/works-live/api.txt -w '%{http_code}' "$base/api/works/provider/me") || api_code=000

            cat /tmp/works-live/home.html /tmp/works-live/provider.html 2>/dev/null \
              | grep -oE 'src="[^"]+\.js[^\"]*"' \
              | sed -E 's/^src="//; s/"$//' \
              | sort -u > /tmp/works-live/scripts.txt || true

            i=0
            while IFS= read -r src; do
              [ -n "$src" ] || continue
              i=$((i+1))
              [ "$i" -le 80 ] || break
              case "$src" in
                http*) url="$src" ;;
                *) url="$base$src" ;;
              esac
              curl -L -sS "$url" -o "/tmp/works-live/${i}.js" || true
            done < /tmp/works-live/scripts.txt

            if grep -RaqE 'useOrganizationCreationDefaults|__experimental_useCheckout|5\.61\.6' /tmp/works-live/*.js 2>/dev/null; then
              marker="clerk-react-5.61.x-fingerprint"
              pass=1
            fi

            echo "attempt=$attempt home=$home_code provider=$provider_code api=$api_code scripts=$i marker=${marker:-none}"
            if [ "$pass" = "1" ] && [ "$home_code" = "200" ] && { [ "$provider_code" = "200" ] || [ "$provider_code" = "302" ] || [ "$provider_code" = "307" ]; } && [ "$api_code" = "401" ]; then
              break
            fi
            sleep 12
          done

          {
            echo "LIVE_WORKS_CLERK_SECURITY=$([ "$pass" = "1" ] && echo PASS || echo FAIL)"
            echo "home_status=$home_code"
            echo "provider_status=$provider_code"
            echo "anonymous_provider_api_status=$api_code"
            echo "served_bundle_marker=${marker:-none}"
            echo "expected_tree=@clerk/nextjs@5.7.6,@clerk/clerk-react@5.61.6,js-cookie@3.0.8"
            date -u '+verified_at=%Y-%m-%dT%H:%M:%SZ'
          } > .works-live-security-result
          cat .works-live-security-result

          rm .github/workflows/works-live-security-verify-2026-08-24.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .works-live-security-result .github/workflows/works-live-security-verify-2026-08-24.yml
          git commit -m "ops: record live Clerk security verification"
          git push origin HEAD:ops/works-live-security-verify-2026-08-24

          [ "$pass" = "1" ] || exit 1
