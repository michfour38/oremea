name: Resonance commerce trace 2026-09-28

on:
  push:
    branches:
      - ops/resonance-commerce-trace-2026-09-28

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Expand owner-only commerce trace
        run: python scripts/tmp-patch-resonance-commerce-trace.py

      - name: Validate complete Oremea application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:launch
          npm run typecheck
          npm run build

      - name: Commit exact tested source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/resonance-commerce-trace-2026-09-28.yml
          rm scripts/tmp-patch-resonance-commerce-trace.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/whop/resonance-catalog.ts app/admin/resonance-commerce/page.tsx scripts/verify-resonance-visits-contract.ts .github/workflows/resonance-commerce-trace-2026-09-28.yml scripts/tmp-patch-resonance-commerce-trace.py
          git diff --cached --quiet && exit 0
          git commit -m "ops: expand owner Resonance commerce trace"
          git push origin HEAD:ops/resonance-commerce-trace-2026-09-28
