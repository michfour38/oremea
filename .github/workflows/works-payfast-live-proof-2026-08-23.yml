name: One-time WORKS PayFast live proof

on:
  push:
    branches:
      - ops/works-payfast-live-proof-2026-08-23
    paths:
      - .github/workflows/works-payfast-live-proof-2026-08-23.yml
  pull_request:
    branches:
      - works-production
    paths:
      - .github/workflows/works-payfast-live-proof-2026-08-23.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/works-proof
          cd /tmp/works-proof
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture live WORKS merchant-review pages
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/payfast-review
        run: |
          mkdir -p "$OUT_DIR"
          cd /tmp/works-proof
          cat > capture.mjs <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const outDir = process.env.OUT_DIR;
          const expectedRelease = 'WORKS_RELEASE=2026-08-23-payfast-screenshot-ready';
          const browser = await chromium.launch({ headless: true });
          const desktop = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          const page = await desktop.newPage();

          async function loadFresh(url, required = []) {
            let lastBody = '';
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              const separator = url.includes('?') ? '&' : '?';
              const proofUrl = `${url}${separator}worksReviewProof=${Date.now()}-${attempt}`;
              await page.goto(proofUrl, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForTimeout(1500);
              lastBody = await page.locator('body').innerText();
              const missing = required.filter((needle) => !lastBody.includes(needle));
              if (missing.length === 0) {
                if (attempt > 1) console.log(`Fresh edge reached for ${url} on attempt ${attempt}.`);
                return lastBody;
              }
              console.log(`Stale edge for ${url} attempt ${attempt}; missing: ${missing.join(' | ')}`);
              await page.waitForTimeout(2000);
            }
            throw new Error(`${url} never reached the required release. Last body: ${lastBody.slice(0, 1200)}`);
          }

          const releaseResponse = await page.request.get(`https://works.oremea.com/works-release.txt?proof=${Date.now()}`, { headers: { 'cache-control': 'no-cache' } });
          if (!releaseResponse.ok()) throw new Error(`WORKS release marker returned ${releaseResponse.status()}`);
          const releaseText = await releaseResponse.text();
          if (!releaseText.includes(expectedRelease) || !releaseText.includes('SOURCE_BRANCH=works-production')) {
            throw new Error(`Unexpected WORKS release marker: ${releaseText}`);
          }

          const checks = [
            ['01-works-home.jpg', 'https://works.oremea.com/', ['Need something made? Start below', 'Know who can make it']],
            ['02-provider-plans.jpg', 'https://works.oremea.com/providers/plans', ['R599 / month', 'R1,999 / month', 'ZAR · recurring monthly', 'Recurring card setup · PayFast by Network', '3D Secure']],
            ['03-provider-join.jpg', 'https://works.oremea.com/providers/join', []],
            ['04-provider-evidence-profile.jpg', 'https://works.oremea.com/providers/nexus-fulfilment', []],
            ['05-works-terms.jpg', 'https://works.oremea.com/terms', ['South African law', 'support@oremea.com']],
            ['06-verification-policy.jpg', 'https://works.oremea.com/verification', []],
            ['07-reviews-policy.jpg', 'https://works.oremea.com/reviews-policy', []],
            ['08-partner-disclosure.jpg', 'https://works.oremea.com/partner-disclosure', []],
            ['09-payments-refunds.jpg', 'https://www.oremea.com/refunds', ['Cancellation', 'Refund', 'South Africa']],
            ['10-privacy-popia.jpg', 'https://www.oremea.com/privacy', ['Privacy']],
            ['11-customer-support.jpg', 'https://www.oremea.com/contact', ['support@oremea.com']],
          ];

          const proof = { releaseText, capturedAt: new Date().toISOString(), pages: [] };
          for (const [filename, url, required] of checks) {
            await loadFresh(url, required);
            const target = path.join(outDir, filename);
            await page.screenshot({ path: target, type: 'jpeg', quality: 78, fullPage: true });
            proof.pages.push({ filename, url, title: await page.title(), requiredText: required });
            console.log(`Captured ${filename} <- ${url}`);
          }

          const visaResponse = await page.request.get(`https://works.oremea.com/payments/works/visa.svg?proof=${Date.now()}`, { headers: { 'cache-control': 'no-cache' } });
          const mastercardResponse = await page.request.get(`https://works.oremea.com/payments/works/mastercard.svg?proof=${Date.now()}`, { headers: { 'cache-control': 'no-cache' } });
          if (!visaResponse.ok() || !mastercardResponse.ok()) throw new Error(`Card assets are not live: Visa ${visaResponse.status()} Mastercard ${mastercardResponse.status()}`);

          const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          const mobilePage = await mobile.newPage();
          for (const [filename, url, required] of [
            ['12-works-home-mobile.jpg', 'https://works.oremea.com/', ['Need something made? Start below']],
            ['13-provider-plans-mobile.jpg', 'https://works.oremea.com/providers/plans', ['ZAR · recurring monthly', 'Recurring card setup · PayFast by Network']],
          ]) {
            let captured = false;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              const separator = url.includes('?') ? '&' : '?';
              await mobilePage.goto(`${url}${separator}worksReviewProof=${Date.now()}-${attempt}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await mobilePage.waitForTimeout(1500);
              const body = await mobilePage.locator('body').innerText();
              if (required.every((needle) => body.includes(needle))) {
                await mobilePage.screenshot({ path: path.join(outDir, filename), type: 'jpeg', quality: 78, fullPage: true });
                proof.pages.push({ filename, url, viewport: '390x844' });
                console.log(`Captured ${filename} <- ${url}`);
                captured = true;
                break;
              }
              await mobilePage.waitForTimeout(2000);
            }
            if (!captured) throw new Error(`Mobile ${url} never reached the required WORKS release.`);
          }

          await writeFile(path.join(outDir, 'proof.json'), JSON.stringify(proof, null, 2));
          await mobile.close();
          await desktop.close();
          await browser.close();
          NODE
          node capture.mjs

      - name: Upload PayFast review screenshot pack
        uses: actions/upload-artifact@v4
        with:
          name: works-payfast-review-screenshots-2026-08-23
          path: artifacts/payfast-review
          if-no-files-found: error
          retention-days: 14
