name: One-time WORKS compatible Clerk security tree

on:
  push:
    branches:
      - works/security-clerk-5.7.6-2026-08-24
    paths:
      - .github/workflows/works-security-clerk-compatible-tree-2026-08-24.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build version-compatible patched Clerk tree
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm pkg delete 'overrides.@clerk/shared'
          npm pkg set 'overrides.@clerk/clerk-react=5.61.6'
          npm pkg set 'overrides.js-cookie=3.0.8'
          npm install

          npm ls @clerk/nextjs @clerk/clerk-react @clerk/backend @clerk/shared @clerk/types js-cookie > /tmp/clerk-ls.txt 2>&1 || true
          npm audit --omit=dev --json > /tmp/audit.json || true

          node <<'NODE' > /tmp/audit-summary.txt
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const counts = data.metadata?.vulnerabilities ?? {};
          const relevant = Object.entries(data.vulnerabilities ?? {})
            .filter(([name, value]) =>
              (name.startsWith('@clerk/') || name === 'js-cookie') &&
              ['high','critical'].includes(value.severity)
            )
            .map(([name, value]) => `${name}:${value.severity}`);
          console.log(`critical=${counts.critical ?? 0}`);
          console.log(`high=${counts.high ?? 0}`);
          console.log(`moderate=${counts.moderate ?? 0}`);
          console.log(`low=${counts.low ?? 0}`);
          console.log(`total=${counts.total ?? 0}`);
          console.log(`clerk_or_cookie_high_or_critical=${relevant.length}`);
          for (const item of relevant) console.log(`relevant_vulnerability=${item}`);
          NODE

          relevant_bad=$(sed -n 's/^clerk_or_cookie_high_or_critical=//p' /tmp/audit-summary.txt)
          critical=$(sed -n 's/^critical=//p' /tmp/audit-summary.txt)
          {
            echo "CLERK_COMPATIBLE_SECURITY=$([ "${critical:-99}" = "0" ] && [ "${relevant_bad:-99}" = "0" ] && echo PASS || echo FAIL)"
            echo "targets=@clerk/nextjs@5.7.6,@clerk/clerk-react@5.61.6,js-cookie@3.0.8"
            cat /tmp/audit-summary.txt
            echo "--- resolved packages ---"
            cat /tmp/clerk-ls.txt
          } > .works-clerk-security-result

          if [ "${critical:-99}" != "0" ] || [ "${relevant_bad:-99}" != "0" ]; then
            rm .github/workflows/works-security-clerk-compatible-tree-2026-08-24.yml
            rm -f .github/workflows/works-clerk-audit-detail-2026-08-24.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json .works-clerk-security-result .github/workflows/works-security-clerk-compatible-tree-2026-08-24.yml .github/workflows/works-clerk-audit-detail-2026-08-24.yml
            git commit -m "security: record remaining compatible Clerk audit"
            git push origin HEAD:works/security-clerk-5.7.6-2026-08-24
            exit 1
          fi
      - name: Validate full launch surface
        shell: bash
        run: |
          set -euo pipefail
          npm run test:launch
          npm run typecheck
          npx prisma generate
          npx next build
      - name: Commit verified compatible Clerk tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/works-security-clerk-compatible-tree-2026-08-24.yml
          rm -f .github/workflows/works-clerk-audit-detail-2026-08-24.yml
          printf '\nvalidation=full-launch-contracts+typecheck+next-build\n' >> .works-clerk-security-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .works-clerk-security-result .github/workflows/works-security-clerk-compatible-tree-2026-08-24.yml .github/workflows/works-clerk-audit-detail-2026-08-24.yml
          git commit -m "security: patch compatible Clerk dependency tree"
          git push origin HEAD:works/security-clerk-5.7.6-2026-08-24
