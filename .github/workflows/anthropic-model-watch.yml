name: ARGUS | Anthropic model watch

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/anthropic-model-watch.mjs'
      - 'scripts/argus-model-assessment.mjs'
      - 'scripts/argus-auto-repair.mjs'
      - 'scripts/argus-auto-repair.test.mjs'
      - 'src/lib/ai/ai-gateway.ts'
      - '.github/workflows/anthropic-model-watch.yml'
  pull_request:
    paths:
      - 'scripts/anthropic-model-watch.mjs'
      - 'scripts/anthropic-model-watch.test.mjs'
      - 'scripts/argus-model-assessment.mjs'
      - 'scripts/argus-model-assessment.test.mjs'
      - 'scripts/argus-auto-repair.mjs'
      - 'scripts/argus-auto-repair.test.mjs'
      - 'scripts/argus-synthetic-probe.mjs'
      - 'src/lib/ai/ai-gateway.ts'
      - '.github/workflows/anthropic-model-watch.yml'

permissions:
  contents: read

concurrency:
  group: anthropic-model-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-watcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/anthropic-model-watch.mjs
            scripts/anthropic-model-watch.test.mjs
            scripts/argus-model-assessment.mjs
            scripts/argus-model-assessment.test.mjs
            scripts/argus-auto-repair.mjs
            scripts/argus-auto-repair.test.mjs
            scripts/argus-deployment-check.mjs
            scripts/argus-deployment-check.test.mjs
            scripts/argus-change-gate.mjs
            scripts/argus-synthetic-probe.mjs
            .github/workflows/anthropic-model-watch.yml
            src/lib/ai/ai-config.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/argus-deployment-check.test.mjs scripts/anthropic-model-watch.test.mjs scripts/argus-model-assessment.test.mjs scripts/argus-auto-repair.test.mjs

  watch:
    if: github.event_name != 'pull_request'
    needs: verify-watcher
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: .anthropic-watch/state.json
          key: anthropic-model-watch-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: anthropic-model-watch-
      - name: Check official sources and configured models
        id: provider_watch
        continue-on-error: true
        run: node scripts/anthropic-model-watch.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PRIMARY_MODEL: ${{ vars.AI_PRIMARY_MODEL }}
          AI_FALLBACK_MODEL: ${{ vars.AI_FALLBACK_MODEL }}
      - name: Recover deprecated or retired model only after a live synthetic test
        run: node scripts/argus-auto-repair.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PRIMARY_MODEL: ${{ vars.AI_PRIMARY_MODEL }}
      - name: Detect eligible model-only change
        id: model_delta
        run: |
          if git diff --quiet -- src/lib/ai/ai-config.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            test "$(git diff --name-only)" = "src/lib/ai/ai-config.ts"
          fi
      - name: Install and verify complete application before applying repair
        if: steps.model_delta.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
        run: |
          npm ci --ignore-scripts
          npx prisma generate
          npm run test:launch
          npm run typecheck
          npm run build
      - name: Publish tested model-only repair to source (never force-push)
        id: model_publish
        if: steps.model_delta.outputs.changed == 'true'
        run: |
          test "$(git diff --name-only)" = "src/lib/ai/ai-config.ts"
          git config user.name "argus-model-recovery[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai/ai-config.ts
          git commit -m "ARGUS: repair unavailable Anthropic model after verified checks"
          git push origin HEAD:main
      - name: Verify Railway rollout on every affected service
        id: rollout
        if: steps.model_publish.outcome == 'success' && steps.model_delta.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/argus-deployment-check.mjs "$(git rev-parse HEAD)"
      - name: Save successful source baseline
        if: ${{ always() && hashFiles('.anthropic-watch/state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .anthropic-watch/state.json
          key: anthropic-model-watch-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-model-watch-report
          path: .anthropic-watch/report.*
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
      - name: Surface unresolved availability issues without false documentation alarms
        if: always()
        env:
          ARGUS_REPAIRED: ${{ steps.rollout.outcome == 'success' && steps.model_delta.outputs.changed == 'true' }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('.anthropic-watch/report.json', 'utf8'));
          const repaired = process.env.ARGUS_REPAIRED === 'true';
          const recoveredModel = report.models.find(m => m.locations.some(loc => loc.startsWith('src/lib/ai/ai-config.ts:')))?.id;
          const unresolved = report.findings.some(f => ['provider_incident','alias_changed','model_retired','configured_model_unavailable'].includes(f.kind) &&
            !(repaired && f.id === recoveredModel && ['model_retired','configured_model_unavailable'].includes(f.kind)));
          if (report.failures.length || unresolved || (report.attentionRequired && !repaired)) {
            console.error('ARGUS_UNRESOLVED_AVAILABILITY_ALERT');
            process.exitCode = 1;
          } else {
            console.log(repaired ? 'ARGUS_MODEL_REPAIR_DEPLOYED' : 'ARGUS_MONITORING_HEALTHY');
          }
          NODE
