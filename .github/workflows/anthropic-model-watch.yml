name: ARGUS | Anthropic model watch

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/anthropic-model-watch.mjs'
      - 'scripts/argus-model-assessment.mjs'
      - 'scripts/argus-auto-repair.mjs'
      - 'scripts/argus-auto-repair.test.mjs'
      - 'src/lib/ai/ai-gateway.ts'
      - '.github/workflows/anthropic-model-watch.yml'
  pull_request:
    paths:
      - 'scripts/anthropic-model-watch.mjs'
      - 'scripts/anthropic-model-watch.test.mjs'
      - 'scripts/argus-model-assessment.mjs'
      - 'scripts/argus-model-assessment.test.mjs'
      - 'scripts/argus-auto-repair.mjs'
      - 'scripts/argus-auto-repair.test.mjs'
      - 'scripts/argus-synthetic-probe.mjs'
      - 'src/lib/ai/ai-gateway.ts'
      - '.github/workflows/anthropic-model-watch.yml'

permissions:
  contents: read

concurrency:
  group: anthropic-model-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-watcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/anthropic-model-watch.mjs
            scripts/anthropic-model-watch.test.mjs
            scripts/argus-model-assessment.mjs
            scripts/argus-model-assessment.test.mjs
            scripts/argus-auto-repair.mjs
            scripts/argus-auto-repair.test.mjs
            scripts/argus-deployment-check.mjs
            scripts/argus-deployment-check.test.mjs
            scripts/argus-change-gate.mjs
            scripts/argus-synthetic-probe.mjs
            .github/workflows/anthropic-model-watch.yml
            src/lib/ai/ai-config.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/argus-deployment-check.test.mjs scripts/anthropic-model-watch.test.mjs scripts/argus-model-assessment.test.mjs scripts/argus-auto-repair.test.mjs

  watch:
    if: github.event_name != 'pull_request'
    needs: verify-watcher
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: .anthropic-watch/state.json
          key: anthropic-model-watch-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: anthropic-model-watch-
      - name: Restore retained baseline if the Actions cache was evicted
        if: hashFiles('.anthropic-watch/state.json') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/anthropic-model-watch.yml/runs?branch=main&per_page=50" --jq '.workflow_runs[] | select(.event == "schedule" or .event == "push" or .event == "workflow_dispatch") | select(.status == "completed") | .id')
          for id in $ids; do
            saved=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '.artifacts[] | select(.name == "argus-last-complete-baseline" and .expired == false) | .id')
            if [ -n "$saved" ]; then
              gh run download "$id" --name argus-last-complete-baseline --dir .anthropic-watch
              test -s .anthropic-watch/state.json
              break
            fi
          done
      - name: Check official sources and configured models
        id: provider_watch
        continue-on-error: true
        run: node scripts/anthropic-model-watch.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PRIMARY_MODEL: ${{ vars.AI_PRIMARY_MODEL }}
          AI_FALLBACK_MODEL: ${{ vars.AI_FALLBACK_MODEL }}
      - name: Recover deprecated or retired model only after a live synthetic test
        run: node scripts/argus-auto-repair.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PRIMARY_MODEL: ${{ vars.AI_PRIMARY_MODEL }}
          AI_FALLBACK_MODEL: ${{ vars.AI_FALLBACK_MODEL }}
      - name: Detect eligible model-only change
        id: model_delta
        run: |
          if git diff --quiet -- src/lib/ai/ai-config.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            test "$(git diff --name-only)" = "src/lib/ai/ai-config.ts"
          fi
      - name: Install and verify complete application before applying repair
        if: steps.model_delta.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
        run: |
          npm ci --ignore-scripts
          npx prisma generate
          npm run test:launch
          npm run typecheck
          npm run build
      - name: Rehearse candidate against all direct caller profiles
        if: steps.model_delta.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node --experimental-strip-types --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { configuredPair } from './scripts/argus-change-gate.mjs';
          import { rehearseDirectRecovery } from './scripts/argus-direct-rehearsal.mjs';
          import { probeRecognition } from './scripts/argus-recognition-probe.mjs';
          const pair = configuredPair(readFileSync('src/lib/ai/ai-config.ts','utf8'));
          for (const model of [pair.primary, pair.fallback]) {
            await probeRecognition(model, process.env.ANTHROPIC_API_KEY);
            await rehearseDirectRecovery(model, process.env.ANTHROPIC_API_KEY);
          }
          NODE
          test "$(git diff --name-only)" = "src/lib/ai/ai-config.ts"
          git diff -- src/lib/ai/ai-config.ts > .anthropic-watch/model-only.patch
          git rev-parse HEAD > .anthropic-watch/base-sha
      - name: Queue verified replacement for the protected PR publisher
        id: proposal
        if: steps.model_delta.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tested-model-repair
          path: |
            .anthropic-watch/base-sha
            .anthropic-watch/model-only.patch
            .anthropic-watch/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Save successful source baseline
        if: ${{ always() && hashFiles('.anthropic-watch/state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .anthropic-watch/state.json
          key: anthropic-model-watch-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain the last complete baseline independently of the cache
        if: always() && hashFiles('.anthropic-watch/state.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: argus-last-complete-baseline
          path: .anthropic-watch/state.json
          include-hidden-files: true
          retention-days: 90
      - name: Save monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-model-watch-report
          path: .anthropic-watch/report.*
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
      - name: Surface unresolved availability issues without false documentation alarms
        if: always()
        env:
          AI_PRIMARY_MODEL: ${{ vars.AI_PRIMARY_MODEL }}
          AI_FALLBACK_MODEL: ${{ vars.AI_FALLBACK_MODEL }}
          ARGUS_QUEUED: ${{ steps.proposal.outcome == 'success' && steps.model_delta.outputs.changed == 'true' }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('.anthropic-watch/report.json', 'utf8'));
          const queued = process.env.ARGUS_QUEUED === 'true';
          const { inventory } = await import('./scripts/anthropic-model-watch.mjs');
          const after = queued ? await inventory(process.cwd(), process.env) : report.models;
          const unresolved = report.findings.some(f => ['provider_incident','alias_changed','model_retired','configured_model_unavailable'].includes(f.kind) &&
            !(queued && !after.some(m => m.id === f.id) && ['model_retired','configured_model_unavailable'].includes(f.kind)));
          if (report.failures.length || unresolved || (report.attentionRequired && !queued)) {
            console.error('ARGUS_UNRESOLVED_AVAILABILITY_ALERT');
            process.exitCode = 1;
          } else {
            console.log(queued ? 'ARGUS_MODEL_REPAIR_QUEUED_FOR_PROTECTED_PR' : 'ARGUS_MONITORING_HEALTHY');
          }
          NODE
