name: Vision KLT copy patch

on:
  push:
    branches:
      - copy/resonance-vision-klt-2026-09-28

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy/resonance-vision-klt-2026-09-28
      - name: Apply Vision copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          entry = Path('app/(member)/entry/page.tsx')
          text = entry.read_text()
          replacement = "\n".join([
              '  8: {',
              '    label: "Creation",',
              '    question: "A future has to survive ordinary life.",',
              '    description:',
              '      "A shared future is easy to love while it is still made of feeling, possibility and someday. Vision brings it down into the ordinary: how days actually run, what people can count on, who owns which responsibilities, how decisions get made, what resources the life requires, what happens when someone cannot do their part, and which assumptions still need a real-world test. The point is not to make the future smaller. It is to make it specific enough to discover whether the life you are imagining can actually hold the people living it.",',
              '    chooseWhen:',
              '      "you can picture a future but the practical shape is still blurry—or when two people can agree on the dream without yet knowing whether they mean the same daily life. Vision does not predict, manifest or promise the future. It helps turn imagination into a design concrete enough to examine and test.",',
              '    comparison: "Make the future specific enough to test.",',
              '  },',
              '  9: {',
          ])
          text, count = re.subn(r'  8: \{.*?\n  \},\n  9: \{', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Vision entry copy block not found')
          entry.write_text(text)

          marketing = Path('src/lib/oremea/public-product-marketing.ts')
          text = marketing.read_text()
          replacement = "\n".join([
              '  "resonance-vision": {',
              '    id: "resonance-vision",',
              '    category: "Resonance room 8",',
              '    headline: "Can the future survive an ordinary Tuesday?",',
              '    buyerDecision:',
              '      "Longing can tell you that you want a future. Design shows you what that future would actually ask of the people living it.",',
              '    description:',
              '      "Vision turns a possible shared life into ordinary days, rhythms, responsibilities, decisions, resources, backup plans and small tests. It makes assumptions concrete enough to examine before imagination is mistaken for an agreement or a workable system.",',
              '    chooseWhen:',
              '      "Enter Vision when ‘someday’ sounds good but the daily architecture is still blurry—or when people agree on the future in principle and need to discover whether they mean the same life in practice. Vision does not manifest, predict or promise an outcome.",',
              '    limits: [',
              '      "No manifestation promise.",',
              '      "No prediction that a future will happen.",',
              '      "No Compass-style execution plan.",',
              '    ],',
              '    public: true,',
              '    weekNumber: 8,',
              '  },',
              '  "resonance-gathering": {',
          ])
          text, count = re.subn(r'  "resonance-vision": \{.*?\n  \},\n  "resonance-gathering": \{', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Vision public marketing block not found')
          marketing.write_text(text)

          contract = Path('scripts/verify-product-marketing-contract.ts')
          text = contract.read_text()
          old = 'assert.match(roomById["resonance-vision"].description, /rhythms, responsibilities, decisions, resources and tests/i);'
          new = "\n".join([
              'assert.match(roomById["resonance-vision"].headline, /ordinary Tuesday/i);',
              'assert.match(roomById["resonance-vision"].buyerDecision, /what that future would actually ask/i);',
              'assert.match(roomById["resonance-vision"].description, /ordinary days, rhythms, responsibilities, decisions, resources/i);',
              'assert.match(roomById["resonance-vision"].chooseWhen, /same life in practice/i);',
              'assert.doesNotMatch(roomById["resonance-vision"].description, /manifest|destiny|guarantee|predict/i);',
          ])
          if old not in text:
              raise SystemExit('Vision marketing contract anchor not found')
          contract.write_text(text.replace(old, new, 1))
          PY
      - name: Verify Vision marketing and types
        run: |
          npm ci
          npm run test:product-marketing
          npm run typecheck
      - name: Commit tested Vision copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/vision-klt-patch.yml
          git add 'app/(member)/entry/page.tsx' src/lib/oremea/public-product-marketing.ts scripts/verify-product-marketing-contract.ts
          git commit -m "Rewrite Vision as KLT conversion copy"
          git push origin HEAD:copy/resonance-vision-klt-2026-09-28
