name: Resolve Recognition migration state

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/read-recognition-migration-state.yml
      - app/api/recognition/migration-status-once/route.ts

permissions:
  contents: read

jobs:
  resolve-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact Oremea release and resolve verified migration state
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          endpoint="https://app.oremea.com/api/recognition/migration-status-once?sha=${RELEASE_SHA}"
          response_file="migration-resolve.json"

          for attempt in $(seq 1 60); do
            status=$(curl \
              --silent \
              --show-error \
              --request POST \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              --connect-timeout 15 \
              --max-time 90 \
              "${endpoint}" || true)

            if [ "${status}" = "200" ] && \
              jq -e '.ok == true and .schemaComplete == true and .applied == true and .unresolvedCount == 0' "${response_file}" >/dev/null 2>&1; then
              echo "Recognition migration history resolved."
              jq '{ok, migration, schemaComplete, applied, unresolvedCount}' "${response_file}"
              exit 0
            fi

            if [ "${status}" = "409" ]; then
              echo "Recognition migration repair precondition changed; refusing to mutate anything."
              cat "${response_file}"
              exit 1
            fi

            sleep 10
          done

          echo "Could not resolve the verified Recognition migration state on the exact release."
          cat "${response_file}" 2>/dev/null || true
          exit 1
