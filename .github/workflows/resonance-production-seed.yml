name: Run Resonance production seed

on:
  push:
    branches:
      - main
    paths:
      - app/api/admin/resonance-seed-once/route.ts
      - .github/workflows/resonance-production-seed.yml

permissions:
  actions: read
  contents: read

jobs:
  seed-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for Railway, seed, and verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -u

          endpoint="https://app.oremea.com/api/admin/resonance-seed-once"

          for attempt in $(seq 1 30); do
            echo "Seed attempt ${attempt}/30"

            status=$(curl \
              --silent \
              --show-error \
              --output resonance-seed-response.json \
              --write-out "%{http_code}" \
              --connect-timeout 15 \
              --max-time 300 \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Run-Id: ${GITHUB_RUN_ID}" \
              "${endpoint}" || true)

            cat resonance-seed-response.json 2>/dev/null || true
            echo

            if [ "${status}" = "200" ]; then
              if jq -e '
                .ok == true and
                .expectedPromptCount == 350 and
                .activePromptCount == 350 and
                (.rooms | type == "array" and length == 10)
              ' resonance-seed-response.json >/dev/null; then
                echo "Resonance production seed verified:"
                jq -r '.rooms[]' resonance-seed-response.json
                exit 0
              fi

              echo "Resonance verification response was incomplete."
              exit 1
            fi

            sleep 20
          done

          echo "Resonance production seed did not complete within the retry window."
          exit 1
