name: Run Resonance production seed

on:
  push:
    branches:
      - main
    paths:
      - app/api/admin/resonance-seed-once/route.ts
      - .github/workflows/resonance-production-seed.yml

permissions:
  contents: read

jobs:
  seed-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for Railway, reset test visit, seed room by room, and verify
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          endpoint="https://app.oremea.com/api/admin/resonance-seed-once"
          response_file="resonance-release-response.json"

          call_release() {
            local url="$1"
            rm -f "${response_file}"
            curl \
              --silent \
              --show-error \
              --request POST \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              --connect-timeout 15 \
              --max-time 28 \
              --header "X-Oremea-Release-Sha: ${RELEASE_SHA}" \
              "${url}" || true
          }

          ready=false
          for attempt in $(seq 1 60); do
            echo "Waiting for final Railway deploy: ${attempt}/60"
            status=$(call_release "${endpoint}?phase=ready")

            if [ "${status}" = "200" ] && \
              jq -e '.ok == true and .phase == "ready"' "${response_file}" >/dev/null 2>&1; then
              ready=true
              break
            fi

            sleep 15
          done

          if [ "${ready}" != "true" ]; then
            echo "The final Railway deployment did not expose the release endpoint in time."
            cat "${response_file}" 2>/dev/null || true
            exit 1
          fi

          echo "Cancelling the active Hearth test visit before prompt IDs change"
          status=$(call_release "${endpoint}?phase=reset-test")
          if [ "${status}" != "200" ] || \
            ! jq -e '.ok == true and .phase == "reset-test"' "${response_file}" >/dev/null 2>&1; then
            echo "The active Hearth test visit could not be reset safely."
            cat "${response_file}" 2>/dev/null || true
            exit 1
          fi
          jq -r '"Cancelled active Hearth test visits: \(.cancelledCount)"' "${response_file}"

          for week in $(seq 1 10); do
            seeded=false

            for attempt in $(seq 1 4); do
              echo "Seeding Resonance room ${week}/10 — attempt ${attempt}/4"
              status=$(call_release "${endpoint}?phase=seed&week=${week}")

              if [ "${status}" = "200" ] && \
                jq -e --argjson week "${week}" \
                  '.ok == true and .phase == "seed" and .weekNumber == $week' \
                  "${response_file}" >/dev/null 2>&1; then
                seeded=true
                break
              fi

              cat "${response_file}" 2>/dev/null || true
              echo
              sleep 10
            done

            if [ "${seeded}" != "true" ]; then
              echo "Resonance room ${week} could not be seeded."
              exit 1
            fi
          done

          verified=false
          for attempt in $(seq 1 4); do
            echo "Verifying all Resonance rooms — attempt ${attempt}/4"
            status=$(call_release "${endpoint}?phase=verify")

            if [ "${status}" = "200" ] && \
              jq -e '
                .ok == true and
                .phase == "verify" and
                .expectedPromptCount == 350 and
                .activePromptCount == 350 and
                (.rooms | type == "array" and length == 10)
              ' "${response_file}" >/dev/null 2>&1; then
              verified=true
              break
            fi

            cat "${response_file}" 2>/dev/null || true
            echo
            sleep 10
          done

          if [ "${verified}" != "true" ]; then
            echo "The production database did not pass the exact Resonance verifier."
            exit 1
          fi

          echo "Resonance production seed verified:"
          jq -r '.rooms[]' "${response_file}"

          status=$(call_release "${endpoint}?phase=close")
          if [ "${status}" != "200" ] || \
            ! jq -e '.ok == true and .phase == "closed"' "${response_file}" >/dev/null 2>&1; then
            echo "The temporary release endpoint did not close cleanly."
            exit 1
          fi
