name: Next 15 migration rehearsal

on:
  push:
    branches:
      - security-next15-20260824
    paths:
      - .github/workflows/next15-dependency-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rehearsal:
    runs-on: ubuntu-22.04
    env:
      # CI-only placeholder. No live or development Clerk credential is stored here.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: security-next15-20260824

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Apply official Next 15 async request API codemod
        run: npx -y @next/codemod@latest next-async-request-api .

      - name: Apply Clerk v6 async auth AST transform directly
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/clerk/javascript/e21ae9a4cf189ed20cb04bee94497533cd9d4dbe/packages/upgrade/src/codemods/transform-async-request.cjs \
            -o /tmp/clerk-transform-async-request.cjs
          npx -y jscodeshift@17.3.0 \
            --transform /tmp/clerk-transform-async-request.cjs \
            --extensions=ts,tsx,js,jsx \
            --ignore-pattern='**/node_modules/**' \
            --ignore-pattern='**/.next/**' \
            .

      - name: Migrate legacy Clerk client object access
        run: |
          cat > /tmp/clerk-client-factory.cjs <<'EOF'
          module.exports = function transformClerkClientFactory({ source }, { jscodeshift: j }) {
            const root = j(source);
            const hasClerkServerImport = root.find(j.ImportDeclaration, {
              source: { value: '@clerk/nextjs/server' },
            }).some(path => path.node.specifiers?.some(specifier =>
              j.ImportSpecifier.check(specifier) && specifier.imported.name === 'clerkClient'
            ));

            if (!hasClerkServerImport) return undefined;
            let dirty = false;

            function makeEnclosingFunctionAsync(path) {
              let current = path.parent;
              while (current) {
                const node = current.node;
                if (
                  j.FunctionDeclaration.check(node) ||
                  j.FunctionExpression.check(node) ||
                  j.ArrowFunctionExpression.check(node)
                ) {
                  if (!node.async) node.async = true;
                  return;
                }
                current = current.parent;
              }
            }

            root.find(j.MemberExpression, {
              object: { type: 'Identifier', name: 'clerkClient' },
            }).forEach(path => {
              path.node.object = j.awaitExpression(
                j.callExpression(j.identifier('clerkClient'), []),
              );
              makeEnclosingFunctionAsync(path);
              dirty = true;
            });

            return dirty ? root.toSource() : undefined;
          };
          module.exports.parser = 'tsx';
          EOF
          npx -y jscodeshift@17.3.0 \
            --transform /tmp/clerk-client-factory.cjs \
            --extensions=ts,tsx,js,jsx \
            --ignore-pattern='**/node_modules/**' \
            --ignore-pattern='**/.next/**' \
            .

      - name: Audit remaining Clerk async call sites
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          unawaited_auth = []
          unawaited_clerk_client = []
          legacy_clerk_client = []
          for path in Path('.').rglob('*'):
              if any(part in {'.git', '.next', 'node_modules'} for part in path.parts):
                  continue
              if path.suffix not in {'.ts', '.tsx', '.js', '.jsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              if '@clerk/nextjs/server' not in text:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  code = line.split('//', 1)[0]
                  if re.search(r'(?<!await )\bauth\(\)', code):
                      unawaited_auth.append(f'{path}:{line_no}:{line.strip()}')
                  if re.search(r'\bclerkClient\(\)', code) and not re.search(r'await\s+clerkClient\(\)', code):
                      unawaited_clerk_client.append(f'{path}:{line_no}:{line.strip()}')
                  if re.search(r'\bclerkClient\.', code):
                      legacy_clerk_client.append(f'{path}:{line_no}:{line.strip()}')

          print(f'Unawaited auth() sites: {len(unawaited_auth)}')
          print(f'Unawaited clerkClient() sites: {len(unawaited_clerk_client)}')
          print(f'Legacy clerkClient.property sites: {len(legacy_clerk_client)}')
          for item in unawaited_auth + unawaited_clerk_client + legacy_clerk_client:
              print(item)
          if unawaited_auth or unawaited_clerk_client or legacy_clerk_client:
              raise SystemExit(1)
          PY

      - name: Install supported Next 15 stack
        run: |
          npm install \
            next@15.5.21 \
            eslint-config-next@15.5.21 \
            react@19 \
            react-dom@19 \
            @types/react@19 \
            @types/react-dom@19 \
            @clerk/nextjs@6.39.6

      - name: Capture complete TypeScript report
        run: |
          set +e
          npm run typecheck > /tmp/next15-typecheck.txt 2>&1
          echo $? > /tmp/next15-typecheck-exit.txt
          set -e
          cat /tmp/next15-typecheck.txt

      - name: Capture migration snapshot and production audit
        run: |
          git diff -- . > /tmp/next15-migration.patch
          git diff --name-only --diff-filter=ACMRTUXB > /tmp/next15-migrated-files.txt
          tar --verbatim-files-from -czf /tmp/next15-migrated-files.tar.gz -T /tmp/next15-migrated-files.txt
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true

      - name: Upload migration rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: next15-migration-rehearsal
          path: |
            /tmp/next15-migration.patch
            /tmp/next15-migrated-files.txt
            /tmp/next15-migrated-files.tar.gz
            /tmp/next15-typecheck.txt
            /tmp/next15-typecheck-exit.txt
            /tmp/npm-audit-production.json
          if-no-files-found: error

      - name: Build application with full launch gate
        run: npm run build

      - name: Persist the tested migration to the branch
        run: |
          if git diff --quiet; then
            echo 'No migration changes to persist.'
            exit 0
          fi
          git config user.name 'oremea-migration-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Persist tested Next 15 React 19 Clerk 6 migration'
          git push origin HEAD:security-next15-20260824
