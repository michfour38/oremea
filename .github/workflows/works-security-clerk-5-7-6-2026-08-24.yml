name: One-time WORKS Clerk critical patch

on:
  push:
    branches:
      - works/security-clerk-5.7.6-2026-08-24
    paths:
      - .github/workflows/works-security-clerk-5-7-6-2026-08-24.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install patched Clerk v5 release
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --save-exact @clerk/nextjs@5.7.6
          echo "--- resolved Clerk packages ---"
          npm ls @clerk/nextjs @clerk/clerk-react @clerk/backend @clerk/shared || true
          echo "--- production critical audit ---"
          npm audit --omit=dev --audit-level=critical
      - name: Validate full launch surface
        shell: bash
        run: |
          set -euo pipefail
          npm run test:launch
          npm run typecheck
          npx prisma generate
          npx next build
      - name: Commit verified dependency patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/works-security-clerk-5-7-6-2026-08-24.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/works-security-clerk-5-7-6-2026-08-24.yml
          git commit -m "security: patch Clerk middleware bypass"
          git push origin HEAD:works/security-clerk-5.7.6-2026-08-24
