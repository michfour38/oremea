name: Optimize Mirror KLT copy

on:
  push:
    branches:
      - copy/resonance-mirror-klt-2026-09-28

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy/resonance-mirror-klt-2026-09-28
      - name: Tighten Mirror copy
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'app/(member)/entry/page.tsx': {
                  '"Sometimes the people change but a familiar sequence does not. You may find yourself smoothing, fixing, explaining, leading, waiting, withdrawing, or carrying something before anyone has asked you to. Mirror slows recurring interactions down enough to separate what happened from what you decided it meant, what you did next, and what tended to follow. The point is not to make everything your responsibility. It is to make your own participation visible enough that choice can appear where habit used to take over."': '"Sometimes the people change but a familiar sequence does not. You may find yourself smoothing, fixing, explaining, leading, waiting, withdrawing, or carrying something before anyone has asked you to. Mirror slows recurring interactions down enough to separate what happened from the story that formed around it, what you did next, and what tended to follow. A pattern can become visible without becoming an identity—and your own participation can become clear without making the whole dynamic your responsibility."',
                  '"the same kind of interaction keeps returning and you want to see the part that is genuinely yours without absorbing the other person’s part. Mirror stays with evidence, exceptions and choice—not a personality label or a story about what is wrong with you."': '"a familiar dynamic keeps returning and you want to see what belongs to your participation—and what does not. Mirror looks for the places where another move may actually be available without diagnosing you, inventing someone else’s motive, or making the whole dynamic yours to carry."',
              },
              'src/lib/oremea/public-product-marketing.ts': {
                  '"The people can change while a familiar sequence keeps returning. You may find yourself smoothing, fixing, explaining, leading, waiting, withdrawing, or taking on more than was asked. Mirror slows the interaction down enough to separate what happened, what you made it mean, what you did next and what followed—so recurrence becomes evidence rather than a label."': '"The people can change while a familiar sequence keeps returning. You may find yourself smoothing, fixing, explaining, leading, waiting, withdrawing, or taking on more than was asked. Mirror slows the interaction down enough to separate what happened from the story that formed around it, what you did next and what followed. A pattern can become visible without becoming an identity."',
                  '"Enter Mirror when a familiar relational difficulty seems to keep returning and you want to locate the part that is genuinely yours to notice. It looks for where a different move may actually be available without inventing a motive or turning the whole dynamic into your responsibility."': '"Enter Mirror when a familiar dynamic keeps returning and you want to see what belongs to your participation—and what does not. It looks for the places where another move may actually be available without diagnosing you, inventing someone else’s motive, or making the whole dynamic yours to carry."',
              },
              'scripts/verify-product-marketing-contract.ts': {
                  'assert.match(roomById["resonance-mirror"].description, /recurrence becomes evidence rather than a label/i);': 'assert.match(roomById["resonance-mirror"].description, /pattern can become visible without becoming an identity/i);',
                  'assert.match(roomById["resonance-mirror"].chooseWhen, /genuinely yours to notice/i);': 'assert.match(roomById["resonance-mirror"].chooseWhen, /belongs to your participation/i);',
              },
          }

          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'Missing expected copy in {filename}: {old[:80]}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Verify Mirror marketing and types
        run: |
          npm ci
          npm run test:product-marketing
          npm run typecheck
      - name: Commit optimized Mirror copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mirror-klt-optimize.yml
          git add 'app/(member)/entry/page.tsx' src/lib/oremea/public-product-marketing.ts scripts/verify-product-marketing-contract.ts
          git commit -m "Optimize Mirror KLT copy"
          git push origin HEAD:copy/resonance-mirror-klt-2026-09-28
