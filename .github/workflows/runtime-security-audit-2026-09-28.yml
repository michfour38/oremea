name: Runtime security audit 2026-09-28

on:
  push:
    branches:
      - audit/runtime-security-2026-09-28

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependency tree
        run: npm ci

      - name: Audit production runtime dependencies only
        shell: bash
        run: |
          npm audit --omit=dev --json > runtime-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('runtime-audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log('RUNTIME_AUDIT_COUNTS=' + JSON.stringify(counts));
          const rows = Object.entries(audit.vulnerabilities ?? {})
            .map(([name, value]) => ({
              name,
              severity: value.severity,
              range: value.range,
              nodes: value.nodes,
              fixAvailable: value.fixAvailable,
              via: (value.via ?? []).map((entry) => typeof entry === 'string' ? entry : ({
                title: entry.title,
                severity: entry.severity,
                range: entry.range,
                url: entry.url,
              })),
            }))
            .sort((a, b) => ['critical','high','moderate','low','info'].indexOf(a.severity) - ['critical','high','moderate','low','info'].indexOf(b.severity));
          console.log('RUNTIME_AUDIT_DETAIL=' + JSON.stringify(rows, null, 2));
          NODE
