name: governance-contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Validate product boundaries and G1-G9 evidence declarations
        run: node scripts/check-governance.mjs
