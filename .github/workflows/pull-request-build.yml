name: Oremea build gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - launch-hardening-20260824
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Apply official Next 15 async request API codemod
        if: github.event_name == 'pull_request' && github.head_ref == 'security-next15-20260824'
        run: npx -y @next/codemod@latest next-async-request-api .

      - name: Apply Clerk v6 async auth AST transform directly
        if: github.event_name == 'pull_request' && github.head_ref == 'security-next15-20260824'
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/clerk/javascript/e21ae9a4cf189ed20cb04bee94497533cd9d4dbe/packages/upgrade/src/codemods/transform-async-request.cjs \
            -o /tmp/clerk-transform-async-request.cjs
          npx -y jscodeshift@17.3.0 \
            --transform /tmp/clerk-transform-async-request.cjs \
            --extensions=ts,tsx,js,jsx \
            --ignore-pattern='**/node_modules/**' \
            --ignore-pattern='**/.next/**' \
            app src components lib middleware.ts

      - name: Audit remaining Clerk async call sites
        if: github.event_name == 'pull_request' && github.head_ref == 'security-next15-20260824'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('app'), Path('src'), Path('components'), Path('lib')]
          unawaited_auth = []
          clerk_client = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.suffix not in {'.ts', '.tsx', '.js', '.jsx'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  if '@clerk/nextjs/server' not in text:
                      continue
                  for line_no, line in enumerate(text.splitlines(), 1):
                      code = line.split('//', 1)[0]
                      if re.search(r'(?<!await )\bauth\(\)', code):
                          unawaited_auth.append(f'{path}:{line_no}:{line.strip()}')
                      if re.search(r'\bclerkClient\(\)', code) and not re.search(r'await\s+clerkClient\(\)', code):
                          clerk_client.append(f'{path}:{line_no}:{line.strip()}')

          print(f'Unawaited auth() sites: {len(unawaited_auth)}')
          for item in unawaited_auth:
              print(item)
          print(f'Unawaited clerkClient() sites: {len(clerk_client)}')
          for item in clerk_client:
              print(item)
          if unawaited_auth or clerk_client:
              raise SystemExit(1)
          PY

      - name: Install supported Next 15 stack for security migration
        if: github.event_name == 'pull_request' && github.head_ref == 'security-next15-20260824'
        run: |
          npm install \
            next@15.5.21 \
            eslint-config-next@15.5.21 \
            react@19 \
            react-dom@19 \
            @types/react@19 \
            @types/react-dom@19 \
            @clerk/nextjs@6.39.6

      - name: Capture migration diff and production audit
        if: github.event_name == 'pull_request' && github.head_ref == 'security-next15-20260824'
        run: |
          git diff -- . ':!package.json' ':!package-lock.json' > /tmp/next15-clerk6-migration.patch
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true

      - name: Capture migration inputs
        if: github.event_name == 'pull_request' && github.head_ref == 'security-next15-20260824'
        uses: actions/upload-artifact@v4
        with:
          name: next15-clerk6-migration-files
          path: |
            package.json
            package-lock.json
            /tmp/next15-clerk6-migration.patch
            /tmp/npm-audit-production.json
          if-no-files-found: error

      - name: Build application
        run: npm run build
