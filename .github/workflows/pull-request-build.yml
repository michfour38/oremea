name: Oremea build gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - launch-hardening-20260824
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Apply official Next 15 async request API codemod
        if: github.event_name == 'pull_request' && github.head_ref == 'security-next15-20260824'
        run: npx -y @next/codemod@latest next-async-request-api .

      - name: Apply Clerk v6 documented async server API migration
        if: github.event_name == 'pull_request' && github.head_ref == 'security-next15-20260824'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('app'), Path('src'), Path('components'), Path('lib')]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.suffix not in {'.ts', '.tsx', '.js', '.jsx'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  if '@clerk/nextjs/server' not in text:
                      continue
                  original = text
                  text = re.sub(r'auth\(\)\.protect\(\)', 'await auth.protect()', text)
                  text = re.sub(r'(?<!await )\bauth\(\)', '(await auth())', text)
                  text = re.sub(r'(?<!await )\bclerkClient\(\)', '(await clerkClient())', text)
                  if text != original:
                      path.write_text(text, encoding='utf-8')
                      changed.append(str(path))
          print(f'Migrated Clerk async APIs in {len(changed)} files')
          for path in changed:
              print(path)
          PY

      - name: Install supported Next 15 stack for security migration
        if: github.event_name == 'pull_request' && github.head_ref == 'security-next15-20260824'
        run: |
          npm install \
            next@15.5.21 \
            eslint-config-next@15.5.21 \
            react@19 \
            react-dom@19 \
            @types/react@19 \
            @types/react-dom@19 \
            @clerk/nextjs@6.39.6

      - name: Capture migration diff and production audit
        if: github.event_name == 'pull_request' && github.head_ref == 'security-next15-20260824'
        run: |
          git diff -- . ':!package.json' ':!package-lock.json' > /tmp/next15-clerk6-migration.patch
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true

      - name: Capture migration inputs
        if: github.event_name == 'pull_request' && github.head_ref == 'security-next15-20260824'
        uses: actions/upload-artifact@v4
        with:
          name: next15-clerk6-migration-files
          path: |
            package.json
            package-lock.json
            /tmp/next15-clerk6-migration.patch
            /tmp/npm-audit-production.json
          if-no-files-found: error

      - name: Build application
        run: npm run build
