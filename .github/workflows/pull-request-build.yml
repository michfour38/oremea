name: Oremea build gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - launch-hardening-20260824
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Apply official Next 15 async request API codemod
        if: github.event_name == 'pull_request' && github.head_ref == 'security-next15-20260824'
        run: |
          npx -y @next/codemod@latest next-async-request-api .
          git diff -- . ':!package.json' ':!package-lock.json' > /tmp/next15-async-request-api.patch

      - name: Install supported Next 15 stack for security migration
        if: github.event_name == 'pull_request' && github.head_ref == 'security-next15-20260824'
        run: |
          npm install \
            next@15.5.21 \
            eslint-config-next@15.5.21 \
            react@19 \
            react-dom@19 \
            @types/react@19 \
            @types/react-dom@19 \
            @clerk/nextjs@6.39.6

      - name: Capture migration inputs
        if: github.event_name == 'pull_request' && github.head_ref == 'security-next15-20260824'
        uses: actions/upload-artifact@v4
        with:
          name: next15-migration-files
          path: |
            package.json
            package-lock.json
            /tmp/next15-async-request-api.patch
          if-no-files-found: error

      - name: Build application
        run: npm run build
