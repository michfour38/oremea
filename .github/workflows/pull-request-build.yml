name: Oremea build gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - launch-hardening-20260824
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI-only placeholder. Production and development Clerk credentials remain
  # environment-owned and are never copied into the repository.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k

jobs:
  production-build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  pull-request-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]],
              text=True,
          ).splitlines()

          resonance_prefixes = (
              "app/(marketing)/resonance/",
              "app/(member)/entry/",
              "app/(member)/resonance/",
              "src/lib/resonance/",
              "prisma/seeds/resonance-content/",
              "docs/resonance-",
          )
          resonance_files = {
              "src/lib/oremea/public-product-marketing.ts",
              "scripts/verify-product-marketing-contract.ts",
              "scripts/verify-resonance-content-contract.ts",
              "scripts/verify-resonance-room-funnel-contract.ts",
          }

          targeted = bool(changed) and all(
              path.startswith(resonance_prefixes) or path in resonance_files
              for path in changed
          )

          print("Changed files:")
          for path in changed:
              print(f"  {path}")
          print(f"Validation scope: {'resonance' if targeted else 'full'}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"scope={'resonance' if targeted else 'full'}\n")
          PY

      - name: Validate Resonance-only change
        if: steps.scope.outputs.scope == 'resonance'
        run: |
          npm run test:resonance-content
          npm run test:product-marketing
          npm run test:provider-neutral-funnels
          npm run test:commerce-routing
          npm run test:public-pricing
          npm run test:affiliates

      - name: Validate shared or cross-product change
        if: steps.scope.outputs.scope == 'full'
        run: npm run test:launch

      - name: Typecheck
        run: npm run typecheck
