name: Pulse KLT copy patch

on:
  push:
    branches:
      - copy/resonance-pulse-klt-2026-09-28

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy/resonance-pulse-klt-2026-09-28
      - name: Apply Pulse copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          entry = Path('app/(member)/entry/page.tsx')
          text = entry.read_text()
          replacement = "\n".join([
              '  5: {',
              '    label: "Attraction",',
              '    question: "Wanting something does not tell you what to do with it.",',
              '    description:',
              '      "A pull can be immediate. Meaning takes longer. Interest can grow, fade, sharpen or change once imagination meets information and real contact. Pulse gives desire somewhere to stay alive long enough to notice what is actually drawing you in, what you hope it will add, what becomes clearer when the pace changes, and whether movement needs action, more information, more time—or nothing yet. Desire can be real without becoming a verdict.",',
              '    chooseWhen:',
              '      "someone or something has your attention and you want to stay close to the wanting without either rushing toward it or talking yourself out of it. Pulse does not decide compatibility, destiny, identity or hidden meaning. It helps desire meet reality before choice.",',
              '    comparison: "Desire can be real before its meaning—or its next move—is clear.",',
              '  },',
              '  6: {',
          ])
          text, count = re.subn(r'  5: \{.*?\n  \},\n  6: \{', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Pulse entry copy block not found')
          entry.write_text(text)

          marketing = Path('src/lib/oremea/public-product-marketing.ts')
          text = marketing.read_text()
          replacement = "\n".join([
              '  "resonance-pulse": {',
              '    id: "resonance-pulse",',
              '    category: "Resonance room 5",',
              '    headline: "Let desire meet reality",',
              '    buyerDecision:',
              '      "Wanting something does not tell you what to do with it.",',
              '    description:',
              '      "Attraction can arrive faster than certainty. Pulse gives desire enough room for time, information and real contact to catch up—so what draws you in, what imagination adds, what changes with pace and what remains can be seen without turning the feeling into a verdict.",',
              '    chooseWhen:',
              '      "Enter Pulse when someone or something has your attention and you want to stay with the aliveness without rushing its meaning. Pulse does not decide compatibility, destiny, identity or hidden motive; it helps desire meet reality before choice.",',
              '    limits: [',
              '      "No compatibility verdict.",',
              '      "No destiny claim.",',
              '      "No invented hidden motive behind attraction.",',
              '    ],',
              '    public: true,',
              '    weekNumber: 5,',
              '  },',
              '  "resonance-shadow": {',
          ])
          text, count = re.subn(r'  "resonance-pulse": \{.*?\n  \},\n  "resonance-shadow": \{', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Pulse public marketing block not found')
          marketing.write_text(text)

          contract = Path('scripts/verify-product-marketing-contract.ts')
          text = contract.read_text()
          old = '''assert.match(roomById["resonance-pulse"].description, /desire, attraction, aliveness/i);
assert.doesNotMatch(roomById["resonance-pulse"].description, /values|alignment/i);'''
          new = '''assert.match(roomById["resonance-pulse"].headline, /desire meet reality/i);
assert.match(roomById["resonance-pulse"].buyerDecision, /wanting something does not tell you what to do with it/i);
assert.match(roomById["resonance-pulse"].description, /time, information and real contact/i);
assert.match(roomById["resonance-pulse"].chooseWhen, /without rushing its meaning/i);
assert.doesNotMatch(roomById["resonance-pulse"].description, /values|alignment|destiny|compatibility/i);'''
          if old not in text:
              raise SystemExit('Pulse marketing contract anchor not found')
          contract.write_text(text.replace(old, new, 1))
          PY
      - name: Verify Pulse marketing and types
        run: |
          npm ci
          npm run test:product-marketing
          npm run typecheck
      - name: Commit tested Pulse copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pulse-klt-patch.yml
          git add 'app/(member)/entry/page.tsx' src/lib/oremea/public-product-marketing.ts scripts/verify-product-marketing-contract.ts
          git commit -m "Rewrite Pulse as KLT conversion copy"
          git push origin HEAD:copy/resonance-pulse-klt-2026-09-28
