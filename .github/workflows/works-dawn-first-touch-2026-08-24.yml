name: One-time WORKS DAWN first-touch extension

on:
  push:
    branches:
      - dawn/works-acquisition-2026-08-24
    paths:
      - .github/workflows/works-dawn-first-touch-2026-08-24.yml

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extend acquisition attribution to buyer and provider funnels
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Buyer flow reads the shared first-touch record captured by the WORKS layout.
          replace_once(
              "components/works/intake/founder-conversation-v2.tsx",
              'import { WorksAccountButton } from "@/components/works/works-account-button";\n',
              'import { WorksAccountButton } from "@/components/works/works-account-button";\nimport { readWorksFirstTouchAttribution } from "@/lib/works/marketing/acquisition";\n',
          )
          replace_once(
              "components/works/intake/founder-conversation-v2.tsx",
              '''function acquisitionAttribution() {\n  const params = new URLSearchParams(window.location.search);\n  let referrerHost = \"\";\n  try {\n    referrerHost = document.referrer ? new URL(document.referrer).hostname.toLowerCase() : \"\";\n  } catch {\n    referrerHost = \"\";\n  }\n\n  return {\n    landingPath: window.location.pathname,\n    referrerHost,\n    utmSource: params.get(\"utm_source\") ?? \"\",\n    utmMedium: params.get(\"utm_medium\") ?? \"\",\n    utmCampaign: params.get(\"utm_campaign\") ?? \"\",\n    utmTerm: params.get(\"utm_term\") ?? \"\",\n    utmContent: params.get(\"utm_content\") ?? \"\",\n  };\n}\n\n''',
              '',
          )
          replace_once(
              "components/works/intake/founder-conversation-v2.tsx",
              '        attribution: acquisitionAttribution(),\n',
              '        attribution: readWorksFirstTouchAttribution(),\n',
          )

          # Provider claim records preserve the same first-touch source.
          replace_once(
              "prisma/works/provider-access.prisma",
              '''  profile_draft  Json?\n  verification_token_hash       String?   @unique\n''',
              '''  profile_draft  Json?\n  landing_path                  String?   @db.VarChar(1024)\n  referrer_host                 String?   @db.VarChar(255)\n  utm_source                    String?   @db.VarChar(255)\n  utm_medium                    String?   @db.VarChar(255)\n  utm_campaign                  String?   @db.VarChar(255)\n  utm_term                      String?   @db.VarChar(255)\n  utm_content                   String?   @db.VarChar(255)\n  verification_token_hash       String?   @unique\n''',
          )
          replace_once(
              "prisma/works/provider-access.prisma",
              '''  @@index([business_email])\n  @@index([verification_expires_at])\n}\n''',
              '''  @@index([business_email])\n  @@index([utm_source, created_at])\n  @@index([utm_campaign, created_at])\n  @@index([verification_expires_at])\n}\n''',
          )

          migration = Path("prisma/migrations/20260824074500_add_works_acquisition_attribution/migration.sql")
          text = migration.read_text()
          marker = '''ALTER TABLE "works_procurement_requests"\n  ADD COLUMN "capture_point" VARCHAR(80);\n\n'''
          provider_sql = '''ALTER TABLE "works_provider_claims"\n  ADD COLUMN "landing_path" VARCHAR(1024),\n  ADD COLUMN "referrer_host" VARCHAR(255),\n  ADD COLUMN "utm_source" VARCHAR(255),\n  ADD COLUMN "utm_medium" VARCHAR(255),\n  ADD COLUMN "utm_campaign" VARCHAR(255),\n  ADD COLUMN "utm_term" VARCHAR(255),\n  ADD COLUMN "utm_content" VARCHAR(255);\n\n'''
          if marker not in text:
              raise SystemExit("Could not extend attribution migration for provider claims")
          text = text.replace(marker, marker + provider_sql, 1)
          text += '''CREATE INDEX "works_provider_claims_utm_source_created_at_idx"\n  ON "works_provider_claims"("utm_source", "created_at");\nCREATE INDEX "works_provider_claims_utm_campaign_created_at_idx"\n  ON "works_provider_claims"("utm_campaign", "created_at");\n'''
          migration.write_text(text)

          # Provider onboarding passes the shared first-touch acquisition record when claiming.
          replace_once(
              "components/works/provider/provider-onboarding-v2.tsx",
              'import { WorksAccountButton } from "@/components/works/works-account-button";\n',
              'import { WorksAccountButton } from "@/components/works/works-account-button";\nimport { readWorksFirstTouchAttribution } from "@/lib/works/marketing/acquisition";\n',
          )
          replace_once(
              "components/works/provider/provider-onboarding-v2.tsx",
              '''          marketSlug: \"za\",\n          profileDraft: form,\n''',
              '''          marketSlug: \"za\",\n          profileDraft: form,\n          attribution: readWorksFirstTouchAttribution(),\n''',
          )

          # Claim API accepts only bounded first-touch marketing fields and preserves them across resends.
          replace_once(
              "app/api/works/provider-claims/route.ts",
              '''  const profileDraft = submittedProfile(body?.profileDraft, marketSlug);\n\n''',
              '''  const profileDraft = submittedProfile(body?.profileDraft, marketSlug);\n  const attribution =\n    body?.attribution && typeof body.attribution === \"object\" && !Array.isArray(body.attribution)\n      ? body.attribution as Record<string, unknown>\n      : {};\n  const landingPath = limitedString(attribution.landingPath, 1024);\n  const referrerHost = limitedString(attribution.referrerHost, 255)?.toLowerCase() ?? null;\n  const utmSource = limitedString(attribution.utmSource, 255);\n  const utmMedium = limitedString(attribution.utmMedium, 255);\n  const utmCampaign = limitedString(attribution.utmCampaign, 255);\n  const utmTerm = limitedString(attribution.utmTerm, 255);\n  const utmContent = limitedString(attribution.utmContent, 255);\n\n''',
          )
          replace_once(
              "app/api/works/provider-claims/route.ts",
              '''      profile_draft: profileDraft ?? undefined,\n      verification_token_hash: verificationTokenHash,\n''',
              '''      profile_draft: profileDraft ?? undefined,\n      landing_path: landingPath,\n      referrer_host: referrerHost,\n      utm_source: utmSource,\n      utm_medium: utmMedium,\n      utm_campaign: utmCampaign,\n      utm_term: utmTerm,\n      utm_content: utmContent,\n      verification_token_hash: verificationTokenHash,\n''',
          )
          # Intentionally do not overwrite attribution in the upsert update branch: first touch stays first touch.

          # DAWN contract must cover host-level persistence and provider acquisition too.
          dawn = Path("scripts/verify-works-dawn-seo-contract.ts")
          text = dawn.read_text()
          text = text.replace(
              'const layout = read("app/works/layout.tsx");\n',
              'const layout = read("app/works/layout.tsx");\nconst acquisition = read("lib/works/marketing/acquisition.ts");\nconst acquisitionCapture = read("components/works/works-acquisition-capture.tsx");\n',
              1,
          )
          text = text.replace(
              'const attributionMigration = read("prisma/migrations/20260824074500_add_works_acquisition_attribution/migration.sql");\n',
              'const attributionMigration = read("prisma/migrations/20260824074500_add_works_acquisition_attribution/migration.sql");\nconst providerAccessSchema = read("prisma/works/provider-access.prisma");\nconst providerOnboarding = read("components/works/provider/provider-onboarding-v2.tsx");\nconst providerClaims = read("app/api/works/provider-claims/route.ts");\n',
              1,
          )
          text = text.replace(
              'assert.match(layout, /"max-image-preview": "large"/);\n',
              'assert.match(layout, /"max-image-preview": "large"/);\nassert.match(layout, /<WorksAcquisitionCapture \\/>/);\nassert.match(acquisitionCapture, /captureWorksFirstTouchAttribution/);\nassert.match(acquisition, /sessionStorage/);\nassert.match(acquisition, /oremea:works:first-touch-acquisition/);\n',
              1,
          )
          text = text.replace(
              'assert.match(conversation, /function acquisitionAttribution/);\nassert.match(conversation, /attribution: acquisitionAttribution\\(\\)/);\n',
              'assert.match(conversation, /readWorksFirstTouchAttribution/);\nassert.match(conversation, /attribution: readWorksFirstTouchAttribution\\(\\)/);\n',
              1,
          )
          text = text.replace(
              'assert.match(env, /WORKS_LEAD_NOTIFY_TO=support@oremea\\.com/);\n',
              '''assert.match(env, /WORKS_LEAD_NOTIFY_TO=support@oremea\\.com/);\nfor (const field of [\n  "landing_path",\n  "referrer_host",\n  "utm_source",\n  "utm_medium",\n  "utm_campaign",\n  "utm_term",\n  "utm_content",\n]) {\n  assert.match(providerAccessSchema, new RegExp(field));\n}\nassert.match(providerOnboarding, /attribution: readWorksFirstTouchAttribution\\(\\)/);\nassert.match(providerClaims, /landing_path: landingPath/);\nassert.match(providerClaims, /utm_campaign: utmCampaign/);\nassert.match(attributionMigration, /ALTER TABLE "works_provider_claims"/);\n''',
              1,
          )
          if 'providerAccessSchema' not in text or 'WorksAcquisitionCapture' not in text:
              raise SystemExit("Could not extend DAWN contract across both funnels")
          dawn.write_text(text)
          PY

          rm .github/workflows/works-dawn-first-touch-2026-08-24.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/works/intake/founder-conversation-v2.tsx \
            prisma/works/provider-access.prisma \
            prisma/migrations/20260824074500_add_works_acquisition_attribution/migration.sql \
            components/works/provider/provider-onboarding-v2.tsx \
            app/api/works/provider-claims/route.ts \
            scripts/verify-works-dawn-seo-contract.ts \
            .github/workflows/works-dawn-first-touch-2026-08-24.yml
          git commit -m "dawn: preserve first-touch attribution across WORKS"
          git push origin HEAD:dawn/works-acquisition-2026-08-24
