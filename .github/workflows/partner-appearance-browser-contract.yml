name: "OREMEA | partner browser-test contract"

on:
  pull_request:
    paths:
      - "e2e/partner-preview/**"
      - ".github/workflows/partner-appearance-browser-contract.yml"
      - ".github/workflows/partner-appearance-browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-types:
    name: "Validate test-only Clerk and Playwright dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: "Install separate test dependencies, no app credentials"
        working-directory: e2e/partner-preview
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: "Typecheck browser and Clerk test APIs without launching the app"
        working-directory: e2e/partner-preview
        run: npm run typecheck
