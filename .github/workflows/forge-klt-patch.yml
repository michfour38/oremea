name: Forge KLT copy patch

on:
  push:
    branches:
      - copy/resonance-forge-klt-2026-09-28

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy/resonance-forge-klt-2026-09-28
      - name: Apply Forge copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          entry = Path('app/(member)/entry/page.tsx')
          text = entry.read_text()
          replacement = "\n".join([
              '  7: {',
              '    label: "Conflict & Repair",',
              '    question: "An apology is not the same thing as repair.",',
              '    description:',
              '      "Conflict can leave several stories tangled together: what happened, what each person meant, what followed, what belongs to whom, and whether anything has actually changed. Forge slows the exchange down enough to separate those pieces without inventing the other person’s inner world. It makes responsibility more specific, repair more observable, and participation more honest—because changed words matter, but changed participation is what gives repair somewhere to live.",',
              '    chooseWhen:',
              '      "a conflict or rupture is still taking up space and you need clearer ground for what is yours to own, what is not, what repair would need to look like in behaviour, and what you will choose if that repair is not available. Forge does not force reconciliation, manufacture remorse, or mediate the relationship.",',
              '    comparison: "Repair becomes real when participation changes.",',
              '  },',
              '  8: {',
          ])
          text, count = re.subn(r'  7: \{.*?\n  \},\n  8: \{', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Forge entry copy block not found')
          entry.write_text(text)

          marketing = Path('src/lib/oremea/public-product-marketing.ts')
          text = marketing.read_text()
          replacement = "\n".join([
              '  "resonance-forge": {',
              '    id: "resonance-forge",',
              '    category: "Resonance room 7",',
              '    headline: "Repair has to become visible",',
              '    buyerDecision:',
              '      "An apology can matter. What changes afterward tells you whether repair is actually happening.",',
              '    description:',
              '      "Forge separates what happened, what followed, what belongs to each person and what repair would need to change in participation. It keeps explanations, intentions and remorse from standing in for evidence, while leaving room for accountability without forced reconciliation.",',
              '    chooseWhen:',
              '      "Enter Forge when a conflict or rupture still needs honest attention and you want clearer ground for responsibility, repair and what happens if repair is not available. It does not invent the other person’s motives, manufacture remorse or mediate the relationship.",',
              '    limits: [',
              '      "Not therapy or mediation.",',
              '      "No forced reconciliation.",',
              '      "No invented account of another person’s intent.",',
              '    ],',
              '    public: true,',
              '    weekNumber: 7,',
              '  },',
              '  "resonance-vision": {',
          ])
          text, count = re.subn(r'  "resonance-forge": \{.*?\n  \},\n  "resonance-vision": \{', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Forge public marketing block not found')
          marketing.write_text(text)

          contract = Path('scripts/verify-product-marketing-contract.ts')
          text = contract.read_text()
          old = 'assert.match(roomById["resonance-forge"].description, /conflict, rupture, honesty and repair/i);'
          new = "\n".join([
              'assert.match(roomById["resonance-forge"].headline, /repair has to become visible/i);',
              'assert.match(roomById["resonance-forge"].buyerDecision, /what changes afterward/i);',
              'assert.match(roomById["resonance-forge"].description, /what belongs to each person/i);',
              'assert.match(roomById["resonance-forge"].chooseWhen, /if repair is not available/i);',
              'assert.doesNotMatch(roomById["resonance-forge"].description, /forgive|reconcile|their motive|their intention/i);',
          ])
          if old not in text:
              raise SystemExit('Forge marketing contract anchor not found')
          contract.write_text(text.replace(old, new, 1))
          PY
      - name: Verify Forge marketing and types
        run: |
          npm ci
          npm run test:product-marketing
          npm run typecheck
      - name: Commit tested Forge copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/forge-klt-patch.yml
          git add 'app/(member)/entry/page.tsx' src/lib/oremea/public-product-marketing.ts scripts/verify-product-marketing-contract.ts
          git commit -m "Rewrite Forge as KLT conversion copy"
          git push origin HEAD:copy/resonance-forge-klt-2026-09-28
