name: Final Resonance room funnel pass

on:
  push:
    branches:
      - resonance/final-room-funnel-and-ci-2026-09-28

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: resonance/final-room-funnel-and-ci-2026-09-28

      - name: Apply final room funnel patch
        run: python .github/scripts/final_resonance_patch.py

      - name: Validate Resonance funnel
        run: |
          npm ci
          npm run test:resonance-room-funnel
          npm run test:resonance-content
          npm run test:product-marketing
          npm run test:provider-neutral-funnels
          npm run test:commerce-routing
          npm run test:public-pricing
          npm run test:affiliates
          npm run typecheck

      - name: Commit tested final pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-resonance-room-funnel.yml .github/scripts/final_resonance_patch.py
          git add \
            'app/(marketing)/resonance/enter/page.tsx' \
            'app/(member)/entry/page.tsx' \
            'app/(member)/resonance/visits/page.tsx' \
            'app/(member)/resonance/visits/actions.ts' \
            'app/(member)/resonance/complete/page.tsx' \
            'app/(member)/resonance/complete/additional-offer-picker.tsx' \
            'src/lib/resonance/room-entry.ts' \
            'scripts/verify-resonance-room-funnel-contract.ts' \
            package.json
          git commit -m "Finish Resonance room conversion funnel"
          git push origin HEAD:resonance/final-room-funnel-and-ci-2026-09-28
