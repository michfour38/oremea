name: Mirror KLT copy patch

on:
  push:
    branches:
      - copy/resonance-mirror-klt-2026-09-28

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy/resonance-mirror-klt-2026-09-28
      - name: Apply Mirror copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          entry = Path('app/(member)/entry/page.tsx')
          text = entry.read_text()
          replacement = "\n".join([
              '  2: {',
              '    label: "Patterns",',
              '    question: "Different relationship. Familiar pattern.",',
              '    description:',
              '      "Sometimes the people change but a familiar sequence does not. You may find yourself smoothing, fixing, explaining, leading, waiting, withdrawing, or carrying something before anyone has asked you to. Mirror slows recurring interactions down enough to separate what happened from what you decided it meant, what you did next, and what tended to follow. The point is not to make everything your responsibility. It is to make your own participation visible enough that choice can appear where habit used to take over.",',
              '    chooseWhen:',
              '      "the same kind of interaction keeps returning and you want to see the part that is genuinely yours without absorbing the other person’s part. Mirror stays with evidence, exceptions and choice—not a personality label or a story about what is wrong with you.",',
              '    comparison: "Different people. Familiar sequences. Notice what keeps travelling with you.",',
              '  },',
              '  3: {',
          ])
          text, count = re.subn(r'  2: \{.*?\n  \},\n  3: \{', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Mirror entry copy block not found')
          entry.write_text(text)

          marketing = Path('src/lib/oremea/public-product-marketing.ts')
          text = marketing.read_text()
          replacement = "\n".join([
              '  "resonance-mirror": {',
              '    id: "resonance-mirror",',
              '    category: "Resonance room 2",',
              '    headline: "Different relationship. Familiar pattern.",',
              '    buyerDecision:',
              '      "When the same kind of interaction keeps showing up, seeing your part can change what is possible without making the whole thing yours to carry.",',
              '    description:',
              '      "The people can change while a familiar sequence keeps returning. You may find yourself smoothing, fixing, explaining, leading, waiting, withdrawing, or taking on more than was asked. Mirror slows the interaction down enough to separate what happened, what you made it mean, what you did next and what followed—so recurrence becomes evidence rather than a label.",',
              '    chooseWhen:',
              '      "Enter Mirror when a familiar relational difficulty seems to keep returning and you want to locate the part that is genuinely yours to notice. It looks for where a different move may actually be available without inventing a motive or turning the whole dynamic into your responsibility.",',
              '    limits: [',
              '      "No personality label or diagnosis.",',
              '      "No invented motive.",',
              '      "No claim that recurrence proves one explanation.",',
              '    ],',
              '    public: true,',
              '    weekNumber: 2,',
              '  },',
              '  "resonance-garden": {',
          ])
          text, count = re.subn(r'  "resonance-mirror": \{.*?\n  \},\n  "resonance-garden": \{', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Mirror public marketing block not found')
          marketing.write_text(text)

          contract = Path('scripts/verify-product-marketing-contract.ts')
          text = contract.read_text()
          old = 'assert.match(roomById["resonance-mirror"].limits.join(" "), /No invented motive/i);'
          new = "\n".join([
              'assert.match(roomById["resonance-mirror"].headline, /familiar pattern/i);',
              'assert.match(roomById["resonance-mirror"].description, /recurrence becomes evidence rather than a label/i);',
              'assert.match(roomById["resonance-mirror"].chooseWhen, /genuinely yours to notice/i);',
              'assert.match(roomById["resonance-mirror"].limits.join(" "), /No invented motive/i);',
              'assert.doesNotMatch(roomById["resonance-mirror"].description, /attachment style|trauma response|diagnos/i);',
          ])
          if old not in text:
              raise SystemExit('Mirror marketing contract anchor not found')
          contract.write_text(text.replace(old, new, 1))
          PY
      - name: Verify Mirror marketing and types
        run: |
          npm ci
          npm run test:product-marketing
          npm run typecheck
      - name: Commit tested Mirror copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mirror-klt-patch.yml
          git add 'app/(member)/entry/page.tsx' src/lib/oremea/public-product-marketing.ts scripts/verify-product-marketing-contract.ts
          git commit -m "Rewrite Mirror as KLT conversion copy"
          git push origin HEAD:copy/resonance-mirror-klt-2026-09-28
