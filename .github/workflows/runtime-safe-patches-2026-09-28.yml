name: Runtime safe security patches 2026-09-28

on:
  push:
    branches:
      - security/runtime-safe-patches-2026-09-28

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply constrained runtime security patches
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies.next = '^15.5.24';
          pkg.devDependencies['eslint-config-next'] = '^15.5.24';
          pkg.overrides = {
            ...(pkg.overrides || {}),
            devalue: '>=5.9.1 <6',
            'form-data': '>=4.0.6 <5',
            nanoid: '>=3.3.18 <4',
            postcss: '>=8.5.23 <9',
            ws: '>=8.21.0 <9'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install

      - name: Audit patched production tree
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /tmp/runtime-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/runtime-audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          const rows = Object.entries(audit.vulnerabilities ?? {})
            .map(([name, value]) => ({ name, severity: value.severity, range: value.range, fixAvailable: value.fixAvailable }))
            .sort((a,b) => ['critical','high','moderate','low','info'].indexOf(a.severity) - ['critical','high','moderate','low','info'].indexOf(b.severity));
          console.log('PATCHED_RUNTIME_AUDIT_COUNTS=' + JSON.stringify(counts));
          console.log('PATCHED_RUNTIME_AUDIT_DETAIL=' + JSON.stringify(rows, null, 2));
          if ((counts.critical ?? 0) !== 0) throw new Error('Critical runtime vulnerabilities remain');
          const unexpectedHigh = rows.filter((row) => row.severity === 'high' && !['jsondiffpatch','sharp'].includes(row.name));
          if (unexpectedHigh.length) throw new Error('Unexpected high runtime findings remain: ' + unexpectedHigh.map((r) => r.name).join(','));
          NODE

      - name: Validate complete Oremea application
        shell: bash
        run: |
          set -euo pipefail
          npm run test:launch
          npm run typecheck
          npm run build

      - name: Commit exact tested dependency tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/runtime-safe-patches-2026-09-28.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/runtime-safe-patches-2026-09-28.yml
          git diff --cached --quiet && exit 0
          git commit -m "security: patch safe production runtime dependencies"
          git push origin HEAD:security/runtime-safe-patches-2026-09-28
