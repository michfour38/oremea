name: Patch Sharp clean 2026-09-28

on:
  push:
    branches:
      - security/patch-sharp-clean-2026-09-28

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch Sharp within Next supported range
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            sharp: '>=0.35.4 <0.36'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install

      - name: Smoke-test native Sharp runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const sharp = require('sharp');
          sharp({
            create: {
              width: 2,
              height: 2,
              channels: 4,
              background: { r: 1, g: 2, b: 3, alpha: 1 }
            }
          })
            .png()
            .toBuffer()
            .then((buffer) => {
              if (!buffer.length) throw new Error('Sharp produced an empty image buffer');
              console.log('SHARP_RUNTIME_SMOKE=PASS version=' + sharp.versions.sharp);
            })
            .catch((error) => {
              console.error(error);
              process.exit(1);
            });
          NODE

      - name: Require zero production runtime audit findings
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /tmp/runtime-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/runtime-audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log('ZERO_RUNTIME_AUDIT_COUNTS=' + JSON.stringify(counts));
          const total = counts.total ?? Object.values(counts).reduce((sum, value) => sum + Number(value || 0), 0);
          if (total !== 0) {
            const rows = Object.entries(audit.vulnerabilities ?? {}).map(([name, value]) => ({ name, severity: value.severity, range: value.range }));
            console.log('ZERO_RUNTIME_AUDIT_DETAIL=' + JSON.stringify(rows, null, 2));
            throw new Error('Production runtime audit is not zero');
          }
          NODE

      - name: Validate complete Oremea application
        shell: bash
        run: |
          set -euo pipefail
          npm run test:launch
          npm run typecheck
          npm run build

      - name: Commit exact tested dependency tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-sharp-clean-2026-09-28.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/patch-sharp-clean-2026-09-28.yml
          git diff --cached --quiet && exit 0
          git commit -m "security: patch Sharp runtime dependency"
          git push origin HEAD:security/patch-sharp-clean-2026-09-28
